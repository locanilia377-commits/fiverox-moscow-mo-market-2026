name: Read registered passenger cars from both regional tables
on:
  push:
    branches: ['qa/moscow-economy-2026']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Select units and read annual values
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/moscow-tables"
          "$RUNNER_TEMP/moscow-tables/bin/pip" -q install selenium==4.32.0
          "$RUNNER_TEMP/moscow-tables/bin/python" - <<'PY'
          import re, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          opt=webdriver.ChromeOptions()
          opt.add_argument('--headless=new'); opt.add_argument('--disable-dev-shm-usage')
          opt.page_load_strategy='eager'
          b=webdriver.Chrome(options=opt); b.set_page_load_timeout(25); b.set_window_size(1400,1050)
          try:
              for geo in ('77','50'):
                  url=f'https://statbase.ru/data/ru{geo}-number-of-passenger-cars-by-region-national-stat/'
                  try:
                      b.get(url)
                      w=WebDriverWait(b,20)
                      ctl=w.until(lambda d:d.find_element(By.ID,'cdp-unit-scale'))
                      print('Scale',geo,[(o.text,o.get_attribute('value')) for o in Select(ctl).options],flush=True)
                      Select(ctl).select_by_visible_text('ед.')
                      for label in b.find_elements(By.XPATH,"//*[normalize-space(text())='Таблица']"):
                          if label.is_displayed():
                              try: label.click(); break
                              except Exception: pass
                      w.until(lambda d: d.execute_script("return [...document.querySelectorAll('table')].some(t=>t.textContent.includes('2024'))"))
                      print('PUBLIC-PARK-ROWS',geo,b.execute_script("return [...document.querySelectorAll('tr')].map(r=>r.innerText.replace(/\\s+/g,' ')).filter(s=>/(?:2024|2025)/.test(s)).slice(0,12)"),flush=True)
                  except Exception as err:
                      print('Public table',geo,str(err)[:150],flush=True)
                      print('VISIBLE-ITEMS',geo,b.execute_script("return [...document.querySelectorAll('table, tr, button, [role=tab], [class*=data-table]')].filter(r=>r.offsetWidth).slice(0,60).map(r=>r.innerText.slice(0,140))"),flush=True)
                      print('SOURCE-DATA',geo,b.execute_script("return [...document.querySelectorAll('script:not([src])')].filter(e=>/2024|4191065|3209074/.test(e.textContent)).map(e=>e.textContent.match(/.{0,75}(?:4191065|3209074|2024).{0,130}/g)?.slice(-5))"),flush=True)
          finally: b.quit()
          PY
