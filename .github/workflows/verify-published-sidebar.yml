name: Verify published CRM sidebar
on:
  push:
    branches: ['qa/crm-sidebar-r13']
permissions: {}
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Test the public release in Chrome
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/sidebar-browser"
          "$RUNNER_TEMP/sidebar-browser/bin/pip" -q install selenium==4.32.0
          "$RUNNER_TEMP/sidebar-browser/bin/python" - <<'PY'
          import base64, os
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs
          from selenium import webdriver
          from selenium.common.exceptions import StaleElementReferenceException
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          
          site = "https://locanilia377-commits.github.io/fiverox-moscow-mo-market-2026/"
          routes = ["public-leads","leads","transfers","customers","plan","visits","tests","equipment","sales","manager-report","analytics","access","manager-guide","coordinator-guide"]
          names = ["Список ЛИДов","Заявки","Передачи дилерам","Клиенты и точки","План действий","Посещения","Тесты плёнок","Оборудование","Продажи","Отчёт менеджера","Аналитика","Доступ","Инструкция менеджера","Инструкция координатора"]
          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--disable-dev-shm-usage")
          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(30)
          ready = WebDriverWait(driver,20,ignored_exceptions=(StaleElementReferenceException,))
          out = Path(os.environ["RUNNER_TEMP"]) / "sidebar-check"
          out.mkdir(exist_ok=True)
          
          def visible_links(browser):
              links = browser.find_elements(By.CSS_SELECTOR,"#crmTab .catalog-nav [data-crm-route]")
              return len(links)==14 and all(link.is_displayed() for link in links)
          
          try:
              for width,height in [(1440,1120),(390,844)]:
                  driver.set_window_size(width,height)
                  driver.execute_cdp_cmd("Emulation.setDeviceMetricsOverride",{"width":width,"height":height,"deviceScaleFactor":2,"mobile":width<600})
                  for area,num in [("region","1124"),("moscow","1127")]:
                      url = site+"?area="+area+"&v=r15#crm"
                      driver.get(url)
                      ready.until(visible_links)
                      assert driver.find_element(By.CSS_SELECTOR,'meta[name="build"]').get_attribute("content") == "moscow-mo-20261128-r15"
                      links = driver.find_elements(By.CSS_SELECTOR,".catalog-nav [data-crm-route]")
                      assert [link.get_attribute("data-crm-route") for link in links] == routes
                      actual = [link.find_elements(By.XPATH,"./span")[1].get_attribute("textContent").strip() for link in links]
                      assert actual == names, actual
                      badge = links[1].find_element(By.CLASS_NAME,"catalog-nav-badge")
                      assert "".join(c for c in badge.text if c.isdigit()) == num
                      assert "rgb(255, 106, 0)" in links[1].value_of_css_property("box-shadow")
                      nav = driver.find_element(By.CSS_SELECTOR,"#crmTab .catalog-nav")
                      results = driver.find_element(By.CLASS_NAME,"catalog-results")
                      if width > 900:
                          assert nav.rect["x"] + nav.rect["width"] <= results.rect["x"]+1
                      else:
                          assert nav.rect["y"] + nav.rect["height"] <= results.rect["y"]+1
                          assert driver.execute_script("return document.documentElement.scrollWidth <= window.innerWidth")
                      access_symbol = links[11].find_element(By.CSS_SELECTOR,"svg")
                      assert access_symbol.rect["width"] == 16 and access_symbol.rect["height"] == 16
                      clip = driver.execute_script("const e=arguments[0].getBoundingClientRect();return {x:e.x+scrollX,y:e.y+scrollY,width:e.width,height:e.height,scale:1}",nav)
                      photo = driver.execute_cdp_cmd("Page.captureScreenshot", {"format":"png","captureBeyondViewport":True,"clip":clip})
                      (out/(area+"-"+str(width)+".png")).write_bytes(base64.b64decode(photo["data"]))
                      links[0].click()
                      assert driver.switch_to.active_element.get_attribute("id") == "catalogQuery"
                      for route in routes[1:]:
                          driver.find_element(By.CSS_SELECTOR,'a[data-crm-route="'+route+'"]').click()
                          ready.until(lambda b:b.execute_script("return document.querySelector(\'#nav [aria-current=page]\')?.dataset.screen") == route)
                          current = urlsplit(driver.current_url)
                          assert current.fragment==route and parse_qs(current.query)["area"]==[area]
                          assert driver.find_element(By.ID,"authScreen").is_displayed()
                          if route=="access":
                              assert driver.find_element(By.CSS_SELECTOR,'#nav [data-screen="access"] svg').is_displayed() or width<600
                          if route=="leads":
                              assert len(driver.find_elements(By.CSS_SELECTOR,"#nav [data-screen]"))==14
                          driver.back()
                          ready.until(visible_links)
                      if width<600:
                          driver.find_element(By.CSS_SELECTOR,'a[data-crm-route="leads"]').click()
                          ready.until(lambda b:b.find_element(By.ID,"authScreen").is_displayed())
                          driver.find_element(By.ID,"menuToggle").click()
                          ready.until(lambda b:b.find_element(By.ID,"menuToggle").get_attribute("aria-expanded")=="true")
                          ready.until(lambda b: b.execute_script("return Math.abs(document.querySelector('#sidebar').getBoundingClientRect().left)<1"))
                          active_links = driver.find_elements(By.CSS_SELECTOR,"#nav [data-screen]")
                          state = driver.execute_script("""const side=document.querySelector('#sidebar');return {size:[innerWidth, innerHeight],drawer:[side.clientWidth,side.clientHeight,side.scrollHeight],links:[...side.querySelectorAll('#nav [data-screen]')].map(e=>[e.dataset.screen,getComputedStyle(e).display,getComputedStyle(e).visibility,Math.round(e.getBoundingClientRect().top)])}""")
                          print(f"{area} mobile drawer {state}",flush=True)
                          assert [x.get_attribute("data-screen") for x in active_links]==routes, state
                          assert all(x[1]!="none" and x[2]=="visible" for x in state["links"]), state
                          last = active_links[-1]
                          driver.execute_script("arguments[0].scrollIntoView({block:'center',behavior:'instant'});",last)
                          ready.until(lambda b:b.execute_script("""const e=document.querySelector('#nav [data-screen=coordinator-guide]');const r=e.getBoundingClientRect();return r.top>=0 && r.bottom<=innerHeight+1 && !!document.elementFromPoint(r.x+r.width/2,(r.top+r.bottom)/2)?.closest('[data-screen=coordinator-guide]')"""))
                          last.click()
                          ready.until(lambda b:b.current_url.endswith("#coordinator-guide"))
                      driver.get(site+"?area="+area+"&v=r15#leads")
                      ready.until(lambda b:b.execute_script("return [...document.querySelectorAll('h1')].some(e => e.getClientRects().length && e.textContent.includes('Рыночная обстановка'))"))
                      assert not driver.execute_script("""return [...document.querySelectorAll('a[href]')].some(e => e.getClientRects().length && /docs\\.google\\.com\\/spreadsheets/.test(e.href))""")
                      print(f"{area} {width}px: verified all 14 links, sections, key symbol, counts, responsive navigation and market screen",flush=True)
          finally:
              driver.quit()
          PY
      - name: Provide desktop navigation preview
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/sidebar-check/region-1440.png"; then
            echo '::group::Browser preview'
            python3 -c 'import os,pathlib,base64; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"sidebar-check"/"region-1440.png"; s=base64.b64encode(p.read_bytes()).decode(); [print("SIDEBAR_BROWSER_PNG " + s[i:i+2000]) for i in range(0,len(s),2000)]'
            echo '::endgroup::'
          fi
      - name: Save screenshots of the navigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moscow-crm-sidebar-r15
          path: ${{ runner.temp }}/sidebar-check/*.png
          retention-days: 5
