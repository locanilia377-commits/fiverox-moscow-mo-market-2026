<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B1114">
  <meta name="build" content="moscow-mo-20261128-r13">
  <meta name="description" content="FIVEROX · экономика региона, рыночная обстановка, калькулятор продаж и СРМ Москвы и Московской области.">
  <meta name="robots" content="noindex,nofollow">
  <title>FIVEROX · Москва и Московская область</title>
  <style>:root {
  --brand-obsidian: #0B1114;
  --brand-carbon: #151D21;
  --brand-graphite: #253037;
  --brand-apex-teal: #00A7A5;
  --brand-deep-teal: #006F70;
  --brand-ice-teal: #A9D8D3;
  --brand-cloud-mineral: #F4F2EC;
  --brand-titanium: #A9B6BC;
  --brand-apex-orange: #FF6A00;
  --brand-teal-wash: color-mix(in srgb, var(--brand-deep-teal) 30%, var(--brand-carbon));
  --brand-field-border: color-mix(in srgb, var(--brand-titanium) 52%, var(--brand-graphite));
}
@font-face{font-family:Onest;src:url("onest-crm.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  color-scheme:dark;
  --base:var(--brand-obsidian);--surface:var(--brand-carbon);--edge:var(--brand-graphite);
  --cloud:var(--brand-cloud-mineral);--titanium:var(--brand-titanium);
  --teal:var(--brand-apex-teal);--deep-teal:var(--brand-deep-teal);--teal-light:var(--brand-ice-teal);--orange:var(--brand-apex-orange);
  --radius:19px;--shell:1320px;
  font:15px/1.5 Onest,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--cloud);min-width:280px}
a{color:var(--teal-light);text-underline-offset:.22em}
button,input,select{font:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--teal-light);outline-offset:4px}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.18;letter-spacing:-.025em}
h1{font-size:clamp(2.1rem,5vw,4.2rem);font-weight:770}
h2{font-size:clamp(1.5rem,3vw,2.2rem)}
h3{font-size:1.05rem}
.shell{width:min(calc(100% - 56px),var(--shell));margin-inline:auto}
.skip{position:absolute;left:16px;top:12px;padding:10px;background:var(--surface);transform:translateY(-160%);z-index:2}
.skip:focus{transform:none}
.top{background:var(--surface);border-bottom:1px solid var(--edge)}
.top-inner,.territories,.sections{display:flex;align-items:center;gap:14px}
.top-inner{justify-content:space-between;min-height:75px}
.logo{display:inline-flex;flex:none;padding-block:8px}
.logo img{display:block;object-fit:cover;object-position:center bottom;width:146px;height:19px}
.territories{background:var(--base);border:1px solid var(--edge);padding:4px;border-radius:12px;gap:4px}
.territories a,.sections a{text-decoration:none;color:var(--titanium);font-weight:630;white-space:nowrap}
.territories a{padding:7px 14px;border:1px solid transparent;border-radius:8px}
.territories a[aria-current]{border-color:var(--teal);background:var(--deep-teal);color:var(--cloud)}
.sections{gap:clamp(15px,4vw,42px);overflow-x:auto;scrollbar-width:thin;padding-top:1px}
.sections a{padding:12px 0 14px;border-bottom:2px solid transparent}
.sections a:hover,.sections a[aria-current]{color:var(--cloud)}
.sections a[aria-current]{border-color:var(--teal)}
.sections a[data-section=crm]{margin-inline-start:auto;color:var(--teal-light)}
main{padding:30px 0 52px}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:218px;display:grid;align-content:center;gap:16px;padding:clamp(22px,5vw,60px);border-radius:var(--radius);border:1px solid var(--edge);background:linear-gradient(112deg,var(--base) 12%,color-mix(in srgb,var(--deep-teal) 30%,var(--base)) 100%);margin-bottom:26px}
.hero::before{content:"";position:absolute;z-index:-1;inset:-110% -5% -110% 39%;background:repeating-radial-gradient(ellipse at 67% 46%,transparent 0 17px,var(--teal-light) 18px 19px,transparent 20px 32px);transform:rotate(-24deg) scaleX(1.45);opacity:.08;mask-image:linear-gradient(100deg,transparent,#000 55%)}
.hero::after{content:"";position:absolute;z-index:-1;top:16px;right:16px;width:74px;height:33px;border-top:1px solid var(--orange);border-right:1px solid var(--orange);opacity:.47}
.hero .cut{position:absolute;z-index:-1;inset:auto 0 0 auto;width:19%;height:88%;clip-path:polygon(84% 0,100% 0,100% 100%,0 100%);background:var(--teal);opacity:.06;pointer-events:none}
.hero p{color:var(--titanium);max-width:60ch}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;background:var(--surface);border:1px solid var(--edge);border-radius:999px;color:var(--cloud);font-size:.82rem;line-height:1.3}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}
.block{margin-top:35px}
.block-head,.section-heading{margin-bottom:15px;display:flex;justify-content:space-between;gap:15px;align-items:flex-end}
.block-head p,.section-heading p{color:var(--titanium);max-width:74ch;margin-top:8px}
.metric-grid,.chart-grid,.calc-results{display:grid;gap:14px}
.metric-grid{grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.chart-grid{grid-template-columns:repeat(auto-fit,minmax(min(350px,100%),1fr));margin-top:14px}
.card,.metric,.result{background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius);padding:21px;min-width:0}
.metric{display:flex;flex-direction:column;gap:6px;border-top-color:var(--deep-teal)}
.metric dt{color:var(--titanium);font-size:.91rem;font-weight:620}
.metric dd{margin:0;font-size:clamp(1.55rem,3.5vw,2.25rem);font-weight:760;line-height:1.12;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.metric dd small{font-size:.96rem;letter-spacing:0;color:var(--titanium)}
.metric p,.fine,.chart-note,.calc-note,.scope-note{color:var(--titanium);font-size:.86rem}
.metric a{font-size:.8rem;margin-top:auto}
.metric-grid dl{margin:0}
.chart-head{display:grid;gap:6px;margin-bottom:17px}
.chart-head p,.chart-note{color:var(--titanium)}
.chart-note{margin-top:15px}
.source-ref{display:inline-block;font-size:.8rem;margin-top:10px}
.donut-grid{display:grid;grid-template-columns:minmax(112px,156px) minmax(0,1fr);gap:20px;align-items:center}
.donut{width:100%;aspect-ratio:1;position:relative;display:grid;place-items:center;margin:auto;border-radius:50%}
.donut::before{content:"";position:absolute;inset:17%;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--edge)}
.donut-center{position:relative;text-align:center;font-size:clamp(.86rem,2.4vw,1.4rem);font-weight:760;font-variant-numeric:tabular-nums}
.legend,.bars{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.legend li{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend-dot{width:8px;height:8px;border-radius:50%;background:var(--datum)}
.legend span,.bars span{font-size:.86rem}
.legend strong,.bars strong{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.legend strong small{display:block;font-size:.75rem;color:var(--titanium);font-weight:500}
.bar-row{display:flex;justify-content:space-between;gap:10px}
.track{height:8px;background:var(--edge);border-radius:999px;overflow:hidden;margin-top:5px}
.track span{display:block;height:100%;border-radius:inherit;background:var(--teal)}
.columns{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;height:190px;padding:12px 0 0;background:repeating-linear-gradient(0deg,transparent 0 43px,var(--edge) 44px 45px)}
.column{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;text-align:center}
.column-plot{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}
.column-plot span{display:block;background:var(--teal);width:min(64%,76px);border-radius:5px 5px 0 0;min-height:3px}
.column:nth-child(odd) .column-plot span{background:var(--teal-light)}
.column-plot strong{font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.column small{padding-top:7px;background:var(--surface);color:var(--titanium)}
.table-wrap{width:100%;overflow:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:12px 13px;border-bottom:1px solid var(--edge);vertical-align:top}
th{font-size:.82rem;color:var(--titanium);font-weight:660}
td.numeric,th.numeric{text-align:right;font-variant-numeric:tabular-nums}
td strong{color:var(--cloud)}
.range-table{min-width:490px}
.economy-key h2{font-size:clamp(1.15rem,2vw,1.55rem);margin-bottom:12px}
.economy-metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.economy-tile{background:linear-gradient(155deg,var(--brand-teal-wash),var(--surface) 60%);gap:9px}
.economy-tile dd small{display:block;margin-top:3px;font-weight:550}
.economy-tile .economy-tile-meta{display:grid;gap:5px;margin-top:auto;font:inherit;letter-spacing:normal}
.economy-tile-baseline{display:flex;align-items:center;flex-wrap:wrap;gap:5px 10px;color:var(--titanium);font-size:.82rem}
.economy-delta{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--brand-teal-wash);color:var(--teal-light);font-size:.82rem;font-weight:720;white-space:nowrap}
.economy-visuals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.economy-visuals h2{font-size:clamp(1.14rem,1.8vw,1.45rem)}
.economy-compare .columns{height:210px}
.economy-chart-footer,.economy-chart-sources{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:12px}
.economy-chart-footer .source-ref,.economy-chart-sources .source-ref{margin:0}
.economy-rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.economy-ring{min-width:0;padding:12px 10px;border-radius:12px;border:1px solid var(--edge)}
.economy-ring h3{text-align:center;font-size:.92rem;margin-bottom:9px}
.economy-ring .donut-grid{grid-template-columns:1fr;gap:10px}
.economy-ring .donut{max-width:108px}
.economy-ring .donut-center{font-size:.86rem}
.economy-ring .legend{gap:5px}
.economy-ring .legend li{gap:5px}
.economy-ring .legend span,.economy-ring .legend strong{font-size:.76rem}
.economy-ring .legend strong small{font-size:.73rem}
.economy-growth .bars{gap:13px}
.economy-growth .bar-row strong{white-space:nowrap;color:var(--cloud)}
.economy-track{position:relative;height:8px;margin-top:6px;background:var(--edge);border-radius:999px;overflow:hidden}
.economy-track::after{content:"";position:absolute;inset:0 auto 0 50%;width:1px;background:var(--titanium)}
.economy-track span{position:absolute;inset:0 auto 0 var(--from);width:var(--width);background:var(--teal)}
.economy-track span.negative{background:var(--orange)}
.economy-intro{margin:8px 0 0}
.economy-detail .economy-section{margin-top:16px}
.economy-section .block-head{margin-bottom:8px}
.economy-section .block-head h3{font-size:clamp(1.25rem,2.5vw,1.65rem)}
.economy-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.economy-table th,.economy-table td{padding:12px 10px;vertical-align:top;border-bottom:1px solid var(--brand-graphite)}
.economy-table tbody tr:last-child>*{border-bottom:0}
.economy-table th[scope=row]{text-align:left;font-weight:400;width:55%}
.economy-table td{white-space:nowrap}
.economy-period{display:block;margin-top:3px;color:var(--brand-titanium);font-size:.83em}
.economy-sources{display:flex;flex-wrap:wrap;gap:4px 12px}
.economy-change{color:var(--brand-ice-teal);font-weight:700}
.economy-bar{display:block;margin:5px 0 0 auto;width:min(100%,65px);height:3px;background:var(--brand-graphite);border-radius:4px;overflow:hidden}
.economy-bar::after{content:"";display:block;height:100%;width:var(--fill);background:var(--brand-titanium);border-radius:inherit}
.economy-table td[data-year="2026"] .economy-bar::after{background:var(--brand-apex-teal)}
@media(max-width:1040px){
  .economy-visuals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .economy-growth{grid-column:1/-1}
}
@media(max-width:700px){
  .economy-visuals{grid-template-columns:1fr;gap:12px}
  .economy-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .economy-compare .columns{height:170px}
}
@media(max-width:370px){
  .economy-ring .legend li{grid-template-columns:8px minmax(0,1fr)}
  .economy-ring .legend strong{grid-column:2;text-align:left;white-space:normal}
  .economy-ring .legend strong small{display:inline;margin-left:4px}
}
@media(max-width:620px){
  .economy-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .economy-table tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--brand-graphite);padding:11px 0;row-gap:7px}
  .economy-table tbody tr:last-child{border-bottom:0}
  .economy-table th[scope=row]{grid-column:1/-1;width:auto}
  .economy-table th,.economy-table td{padding:0;border:0}
  .economy-table td{text-align:left;font-size:clamp(.78rem,3.6vw,.95rem)}
  .economy-table td::before{content:attr(data-year);font-size:.75rem;font-weight:400;color:var(--brand-titanium);display:block}
  .economy-bar{margin-left:0}
}
.source-details{margin-top:12px}
.source-details summary{color:var(--teal-light);font-size:.9rem;font-weight:620;cursor:pointer}
.source-list{display:grid;gap:10px;margin-top:13px;padding-left:22px}
.source-list p{color:var(--titanium)}
.scope-note{margin-top:13px}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-block:20px;color:var(--titanium);font-size:.83rem}
.footer strong{color:var(--cloud)}
.button,.quick-picks button,.scenario-table button{display:inline-flex;justify-content:center;align-items:center;border-radius:9px;border:1px solid var(--brand-field-border);background:var(--brand-teal-wash);color:var(--cloud);padding:9px 13px;font-weight:650;text-decoration:none}
.button.primary{background:var(--orange);border-color:var(--orange);color:var(--base)}
.button.secondary{background:var(--surface)}
.button:hover,.quick-picks button:hover,.scenario-table button:hover{background:var(--edge);border-color:var(--teal-light)}
.button.primary:hover{background:var(--cloud);border-color:var(--orange)}
.button.small{font-size:.82rem;padding:6px 9px}
.callout{padding:14px 16px;background:var(--brand-teal-wash);border-radius:11px;border-left:2px solid var(--teal);margin-top:14px}
.callout p{margin-top:6px}
.note{border-left:2px solid var(--orange);padding-left:11px;color:var(--titanium)}
.crm-tab{padding-bottom:40px}
.catalog-layout{display:grid;grid-template-columns:238px minmax(0,1fr);gap:20px;margin:20px 0;align-items:start}
.catalog-nav{position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow-y:auto;scrollbar-width:thin;color:var(--titanium);background:var(--base);padding:12px 10px 18px}
.catalog-nav nav{display:grid;gap:5px}
.catalog-nav nav::after{content:"";height:1px;background:var(--edge);margin:17px 12px 0}
.catalog-nav-item{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:9px 13px;border-radius:7px;color:var(--titanium);text-align:left;text-decoration:none;font-size:14px;font-weight:570;line-height:1.25}
.catalog-nav-item:hover{background:var(--surface);color:var(--cloud)}
.catalog-nav-item[data-crm-route$="-guide"]>span:nth-child(2){max-inline-size:12ch}
.catalog-results{min-width:0}
.catalog-nav-item:focus-visible{outline-offset:-2px}
.catalog-nav-icon{flex:0 0 20px;color:inherit;text-align:center;font-size:17px;line-height:1}
.catalog-nav-label{padding:24px 15px 7px;color:var(--titanium);font-size:10px;font-weight:700;letter-spacing:1.25px;text-transform:uppercase}
.catalog-nav-item.requests{color:var(--cloud);font-weight:730;background:linear-gradient(105deg,color-mix(in srgb,var(--orange) 17%,var(--surface)),var(--surface));box-shadow:inset 3px 0 var(--orange)}
.catalog-nav-item.requests .catalog-nav-icon,.catalog-nav-badge{color:color-mix(in srgb,var(--orange) 58%,var(--cloud))}
.catalog-nav-badge{margin-inline-start:auto;padding:2px 6px;border-radius:5px;background:var(--base);font-size:11px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:780px){.catalog-nav{position:static;max-height:none;overflow:visible;justify-self:stretch}.catalog-nav-item{min-height:44px}}

.catalog-filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.catalog-filters label{display:grid;gap:7px;min-width:0;font-size:.9rem}
.catalog-filters input,.catalog-filters select{min-width:0;width:100%;border:1px solid var(--edge);border-radius:7px;background:var(--base);color:var(--cloud);padding:10px;font:inherit}
.catalog-filters select:focus-visible{outline:2px solid var(--teal-light);outline-offset:4px}
.catalog-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.catalog-card{overflow-wrap:anywhere}
.catalog-card h3,.catalog-card p{margin:7px 0}
.catalog-card small{color:var(--titanium)}
.catalog-card summary{cursor:pointer}
.catalog-card ul{padding-inline-start:20px}
.catalog-links,.catalog-pager{display:flex;gap:12px;flex-wrap:wrap}
.catalog-pager{margin-top:12px}
.catalog-pager button:disabled{opacity:.45;cursor:default}
.honeycomb{position:relative;isolation:isolate;overflow:hidden}
.honeycomb::before{content:"";position:absolute;inset:0 0 0 48%;z-index:-1;opacity:.08;mask-image:linear-gradient(90deg,transparent,#000);background-image:linear-gradient(30deg,var(--teal-light) 1px,transparent 1px),linear-gradient(150deg,var(--teal-light) 1px,transparent 1px),linear-gradient(30deg,var(--teal-light) 1px,transparent 1px),linear-gradient(150deg,var(--teal-light) 1px,transparent 1px),linear-gradient(60deg,transparent 71%,var(--teal-light) 72% 74%,transparent 75%),linear-gradient(60deg,transparent 71%,var(--teal-light) 72% 74%,transparent 75%);background-size:35px 60px;background-position:0 0,0 0,17.5px 30px,17.5px 30px,0 0,17.5px 30px}
.basket-card,.calc-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.basket-card{border-color:var(--deep-teal);background:linear-gradient(115deg,var(--brand-teal-wash),var(--surface));margin-bottom:16px}
.basket-card h3{font-size:1.65rem;margin-block:8px}
.basket-caption{color:var(--teal-light);font-weight:660}
.basket-mini{display:grid;gap:8px}
.basket-mini>div,.range-ends,.margin-line,.progress-caption{display:flex;align-items:center;justify-content:space-between;gap:12px}
.basket-mini>div{border-bottom:1px solid var(--edge);padding-bottom:4px}
.basket-mini span,.range-ends{font-size:.85rem;color:var(--titanium)}
.calc-inputs>label{font-weight:620}
.points-control{display:flex;align-items:center;gap:12px;margin:12px 0}
input[type=number]{width:100%;border:1px solid var(--brand-field-border);border-radius:8px;background:var(--base);color:var(--cloud);padding:8px 10px}
.points-control input{max-width:130px;font-size:1.27rem}
input[type=range]{accent-color:var(--teal);width:100%}
.quick-picks,.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.margin-line{margin-bottom:8px}
.margin-line input{max-width:94px}
.progress-card{padding:11px 12px;background:var(--base);border-radius:11px;margin-top:10px}
.progress-card .fine,.calc-note{margin-top:8px}
.result .big-number{font-size:clamp(1.25rem,2.8vw,2rem);font-weight:750;margin-block:6px;color:var(--teal-light)}
.result.primary{border-color:var(--deep-teal);background:var(--brand-teal-wash)}
.result small{color:var(--titanium)}
.calc-results{grid-template-columns:repeat(2,minmax(0,1fr))}
.calc-basket,.wide-card{margin-top:16px}
.card-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.basket-table,.scenario-table{min-width:520px}
.basket-settings{margin-bottom:16px}
.basket-settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.basket-product{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:6px 12px 12px;min-width:0;border:1px solid var(--edge);border-radius:11px}
.basket-product legend{padding-inline:5px;font-weight:650}
.basket-settings-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px}
.basket-settings-footer input{max-width:160px}
.basket-settings-footer .fine{margin-top:5px}
.field{display:grid;gap:4px;font-size:.86rem;margin-top:5px}
.scenario-table button{padding:2px 7px}
.muted{color:var(--titanium)}

  <script>function calculate(points,margin=20,base=0){
 const n=Number(points),m=Number(margin);
 points=Math.min(1000000,Math.max(0,Math.floor(Number.isFinite(n)?n:0)));
 margin=Math.round(Math.min(100,Math.max(0,Number.isFinite(m)?m:20))*10)/10;
 const perPoint=13000+30000+3*52000,turnover=points*perPoint,contribution=Math.round(turnover*margin/100);
 return {points,margin,base,perPoint,turnover,contribution,annualTurnover:turnover*12,annualContribution:contribution*12,rolls:points*5,progress:base>0?Math.min(100,points/base*100):0,share:base>0?points/base*100:0};
}

(()=>{
'use strict';
const defaultBasket = {tintQty: 0, tintPrice: 13000, athermQty: 0, athermPrice: 30000, ppfQty: 5, ppfPrice: 52000};
const defaultTarget = 20;
function scenarioKey() { return 'fx-moscow-mo-model-v2-' + view().territory; }
function scenarioChoices() { return [...new Set([10, 25, 50, 100].filter(n => n < S.total).concat(S.total))]; }
const products = [['Тонировочная', 'tint'], ['Атермальная', 'atherm'], ['Полиуретановая', 'ppf']];
let basket = {...defaultBasket};
let target = defaultTarget;

function scenarioNumber(value) {
  return typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= 10000000;
}

function readScenario() {
  let values;
  try {
    values = JSON.parse(localStorage.getItem(scenarioKey()));
    if (!values) {
      const previous = JSON.parse(localStorage.getItem('fiverox-moscow-mo-model-v1'));
      if (previous?.schema === 1) values = {...previous.values, basket: previous.values};
    }
  } catch {}
  for (const key of Object.keys(defaultBasket)) {
    const value = query.has(key) ? Number(query.get(key)) : values?.basket?.[key];
    if (scenarioNumber(value)) basket[key] = value;
  }
  const savedTarget = query.has('target') ? Number(query.get('target')) : values?.target;
  if (scenarioNumber(savedTarget) && Number.isInteger(savedTarget)) target = savedTarget;
  return values;
}

function applyScenarioToUrl(url) {
  for (const key of Object.keys(defaultBasket)) url.searchParams.set(key, basket[key]);
  url.searchParams.set('target', target);
}

function calculateRegional(points, margin, base) {
  const result = calculate(points, margin, base);
  const perPoint = products.reduce((total, [, key]) => total + basket[key+'Qty'] * basket[key+'Price'], 0);
  const perPointRolls = products.reduce((total, [, key]) => total + basket[key+'Qty'], 0);
  const turnover = result.points * perPoint;
  const contribution = Math.round(turnover * result.margin / 100);
  return Object.assign(result, {
    perPoint, perPointRolls, turnover, contribution, rolls: result.points * perPointRolls,
    annualTurnover: turnover * 12, annualContribution: contribution * 12,
  });
}

function renderBasket(result) {
  document.querySelectorAll('[data-basket-rolls]').forEach(el => el.textContent = num(result.perPointRolls));
  document.querySelectorAll('[data-basket-total]').forEach(el => el.textContent = money(result.perPoint));
  document.getElementById('basketSummary').innerHTML = products.map(([label,key]) => {
    const quantity = basket[key+'Qty'], price = basket[key+'Price'];
    return `<div><span>${label} · ${num(quantity)} рул. × ${money(price)}</span><strong>${money(quantity*price)}</strong></div>`;
  }).join('')+`<div><span>Итого на одну точку</span><strong>${money(result.perPoint)} / месяц</strong></div>`;
  document.getElementById('liveBasket').innerHTML = products.map(([label,key]) => {
    const quantity = basket[key+'Qty'], price = basket[key+'Price'];
    return `<tr><td>${label}</td><td class="numeric">${num(quantity)}</td><td class="numeric">${money(price)}</td><td class="numeric">${num(quantity*result.points)}</td><td class="numeric">${money(quantity*price*result.points)}</td></tr>`;
  }).join('');
  document.getElementById('targetProgress').textContent = target
    ? `К цели: ${num(result.points)} из ${num(target)} точек · ${pct(100*result.points/target)}`
    : 'Цель подключения не задана.';
}

function updateBasketInput(input) {
  const key = input.dataset.basketKey, value = input.valueAsNumber;
  if (!input.validity.valid || !scenarioNumber(value)) return;
  if (key === 'target') target = value;
  else basket[key] = value;
  state.calc = calculateRegional(state.calc.points, state.calc.margin, S.total);
  updateCalc();
}


function calculator(){return `${heading('Калькулятор продаж','Укажите число подключённых точек. Все показатели пересчитываются сразу.',`<button class="button secondary" id="shareCalc">Копировать расчёт ↗</button>`)}<section class="card basket-card"><div><p class="basket-caption">Модель продаж · средняя закупка одной точки за месяц</p><h3><span data-basket-rolls></span> рул. → <span class="big-number" data-basket-total></span></h3><p class="fine">При маржинальности <span data-point-model-out="margin"></span>% — <strong><span data-point-model-out="contribution"></span> маржинального дохода</strong> с точки в месяц. Скидки и промо уже учтены в марже.</p></div><div class="basket-mini" id="basketSummary"></div></section>${basketSettings()}<div class="calc-layout"><section class="card calc-inputs"><label for="points">Количество подключённых точек</label><div class="points-control"><input id="points" type="number" min="0" max="1000000" step="1" inputmode="numeric" value="${state.calc.points}"><span>точек</span></div><input id="pointsRange" type="range" min="0" max="${S.total}" step="1" value="${Math.min(S.total,state.calc.points)}" aria-label="Количество подключённых точек, ползунок"><div class="range-ends"><span>0</span><span>${S.total} — вся подтверждённая база</span></div><div class="quick-picks">${scenarioChoices().map(n=>`<button data-points="${n}">${n}</button>`).join('')}</div><div class="margin-line"><label for="margin">Маржинальность, %</label><input type="number" id="margin" min="0" max="100" step="0.1" inputmode="decimal" value="${state.calc.margin}"></div><p class="fine">По умолчанию 20% — с учётом скидок и промо. Дополнительно вычитать скидки из расчёта не нужно.</p><div class="progress-card"><div class="progress-caption"><span>Доля подтверждённой базы в сценарии</span><strong id="progressText"></strong></div><div class="track" id="connectionProgress" role="progressbar" aria-label="Число точек сценария относительно подтверждённой базы" aria-valuemin="0" aria-valuemax="${S.total}"><span id="progressFill"></span></div><p class="fine" id="progressDescription"></p></div><p class="calc-note">Сценарий сохраняется в этом браузере. Фактические подключения и цель продаж в базе не ведутся.</p></section><div class="calc-results"><div class="result primary"><p>Оборот в месяц</p><div class="big-number" data-out="turnover"></div><small><span data-out="points"></span> точек × <span data-basket-total></span></small></div><div class="result teal"><p>Маржинальный доход в месяц</p><div class="big-number" data-out="contribution"></div><small>Оборот × <span data-out="margin"></span>%</small></div><div class="result"><p>Оборот за 12 месяцев</p><div class="big-number" data-out="annualTurnover"></div><small>При одинаковом числе точек каждый месяц</small></div><div class="result"><p>Маржинальный доход за 12 месяцев</p><div class="big-number" data-out="annualContribution"></div><small>При неизменной маржинальности</small></div></div></div><section class="card calc-basket"><div class="card-head"><h3>Из чего складывается оборот</h3><span class="fine">1 точка · <span data-basket-rolls></span> рул. в месяц</span></div><div class="table-wrap"><table class="basket-table"><thead><tr><th>Плёнка</th><th class="numeric">На точку, рул.</th><th class="numeric">Цена рулона</th><th class="numeric">Всего рулонов / месяц</th><th class="numeric">Оборот / месяц</th></tr></thead><tbody id="liveBasket"></tbody><tfoot><tr><td>Итого</td><td class="numeric" data-basket-rolls></td><td class="numeric"><span data-basket-total></span> / точка</td><td class="numeric" data-out="rolls"></td><td class="numeric" data-out="turnover"></td></tr></tfoot></table></div><p class="calc-note">Модель предполагает одинаковую закупку на каждой подключённой точке. Маржинальный доход = оборот × маржинальность. Это не чистая прибыль: операционные расходы и налоги отдельно не моделируются.</p></section><section class="card wide-card"><h3>Сценарии подключения</h3><div class="table-wrap"><table class="scenario-table"><thead><tr><th>Точек</th><th class="numeric">Оборот / месяц</th><th class="numeric">Маржинальный доход / месяц</th><th class="numeric">Рулонов / месяц</th></tr></thead><tbody id="scenarios"></tbody></table></div><div class="callout"><strong>Сценарий 100% подключения</strong><p>Все ${num(S.total)} подтверждённых точек: <strong data-full-base-out="turnover"></strong> оборота и <strong data-full-base-out="contribution"></strong> маржинального дохода в месяц при маржинальности <span data-full-base-out="margin"></span>%.</p><p class="fine">Расчётный потенциал текущей выборки. Фактические подключения и продажи не установлены.</p></div></section>`}
function updateCalc(){const c=state.calc;renderBasket(c);const perPoint=calculateRegional(1,c.margin,S.total),fullBase=calculateRegional(S.total,c.margin,S.total);document.querySelectorAll('[data-point-model-out]').forEach(el=>{const k=el.dataset.pointModelOut;el.textContent=k==='margin'?num(perPoint[k]):money(perPoint[k])});document.querySelectorAll('[data-full-base-out]').forEach(el=>{const k=el.dataset.fullBaseOut;el.textContent=k==='margin'?num(fullBase[k]):money(fullBase[k])});document.querySelectorAll('[data-out]').forEach(el=>{const k=el.dataset.out;el.textContent=['points','rolls','margin'].includes(k)?num(c[k]):money(c[k])});
 document.getElementById('progressText').textContent=pct(c.share);document.getElementById('progressFill').style.width=c.progress+'%';document.getElementById('connectionProgress').setAttribute('aria-valuenow',Math.min(c.points,S.total));document.getElementById('connectionProgress').setAttribute('aria-valuetext',`${c.points} из ${S.total} точек`);document.getElementById('progressDescription').textContent=c.points<=S.total?`${num(c.points)} из ${num(S.total)} подтверждённых точек.`:`На ${num(c.points-S.total)} точек больше текущей выборки. Число можно задать для расширенного сценария.`;document.getElementById('pointsRange').value=Math.min(c.points,S.total);
 document.getElementById('scenarios').innerHTML=scenarioChoices().map(n=>{const x=calculateRegional(n,c.margin,S.total);return `<tr><td><button data-points="${n}" aria-label="Рассчитать ${n} точек">${num(n)}</button>${n===S.total?' <small class="muted">вся база</small>':''}</td><td class="numeric">${money(x.turnover)}</td><td class="numeric">${money(x.contribution)}</td><td class="numeric">${num(x.rolls)}</td></tr>`}).join('');try{localStorage.setItem(scenarioKey(),JSON.stringify({points:c.points,margin:c.margin,basket,target}))}catch{}}

const profileGroups = {
  wrap: ['Оклейка', 'Обе услуги'],
  tint: ['Тонировка', 'Обе услуги'],
  both: ['Обе услуги'],
  candidate: ['Требует проверки'],
};
const sourceNames = {'Яндекс': 'Яндекс Карты', '2ГИС': '2ГИС', 'Сайт': 'Сайт'};
const compareText = new Intl.Collator('ru', {numeric: true}).compare;
const catalogPlural = new Intl.PluralRules('ru');
const normalizeSearch = text => text.trim().toLocaleLowerCase('ru').replace(/ё/g, 'е');
let catalogRequest;

function catalogRank(card) {
  if (card.profile === 'Обе услуги') return 0;
  return card.profile === 'Требует проверки' ? 2 : 1;
}

function loadCatalog() {
  if (!catalogRequest) {
    catalogRequest = fetch(`public-leads.json?v=${encodeURIComponent(DATA.revision)}`)
      .then(response => {
        if (!response.ok) throw new Error('Catalog unavailable');
        return response.json();
      })
      .then(cards => {
        if (!Array.isArray(cards)) throw new Error('Invalid catalog');
        return cards.sort((a, b) => catalogRank(a) - catalogRank(b) ||
          compareText(a.city, b.city) || compareText(a.name, b.name) || compareText(a.id, b.id));
      })
      .catch(error => {
        catalogRequest = null;
        throw error;
      });
  }
  return catalogRequest;
}

function catalogLink(url, label) {
  if (!/^https:\/\/\S+$/i.test(url || '')) return '';
  return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`;
}

function catalogCard(card) {
  const prices = card.prices.map(price => {
    const scope = price.scope ? ` · ${esc(price.scope)}` : '';
    const from = price.type === 'От' ? 'от ' : '';
    return `<li>${esc(price.service)}${scope} · ${from}${money(price.value)}<br>${catalogLink(price.url, 'Источник')}</li>`;
  });
  const sources = card.sources.map(source => catalogLink(source.url, sourceNames[source.source] || source.source));
  return `<article class="card catalog-card" data-public-lead-id="${esc(card.id)}">
    <small>${esc(card.city || 'Не указан')} · ${esc(card.id)}</small><h3>${esc(card.name)}</h3><strong>${esc(card.profile)}</strong>
    <p>${esc(card.address || 'Адрес не опубликован')}</p><p>${esc(card.phone || 'Телефон не опубликован')}</p>
    <p class="catalog-links">${sources.join('')}</p>
    ${prices.length ? `<details><summary>Опубликованные цены (${prices.length})</summary><ul>${prices.join('')}</ul></details>` : ''}
  </article>`;
}

function filterCatalog(cards, filters) {
  const query = normalizeSearch(filters.query);
  const digits = query.replace(/\D/g, '');
  const profiles = profileGroups[filters.profile];
  return cards.filter(card => {
    const text = normalizeSearch([card.name, card.city, card.address, card.phone, card.id].join(' '));
    const priceMatches = filters.price === 'all' || (filters.price === 'with') === Boolean(card.prices.length);
    const queryMatches = text.includes(query) || (digits.length >= 5 && (card.phone || '').replace(/\D/g, '').includes(digits));
    return priceMatches && queryMatches && (!profiles || profiles.includes(card.profile));
  });
}

const catalogMenuRoutes = [["leads","▦","Заявки"],["transfers","⇄","Передачи дилерам"],["customers","▣","Клиенты и точки"],["plan","✓","План действий"],["visits","◷","Посещения"],["tests","◇","Тесты плёнок"],["equipment","▱","Оборудование"],["sales","₽","Продажи"],["manager-report","▤","Отчёт менеджера"],["analytics","▥","Аналитика"],["access","⚿","Доступ"],["manager-guide","?","Инструкция менеджера"],["coordinator-guide","?","Инструкция координатора"]];

function catalogSidebar(selectedArea) {
  const cabinet = new URL('cabinet.html', location.href);
  cabinet.searchParams.set('area', selectedArea);
  const scope = view();
  const items = catalogMenuRoutes.map(([route, icon, label]) => {
    cabinet.hash = route;
    const requests = route === 'leads';
    const badge = requests
      ? `<span class="catalog-nav-badge" title="Точек в исследовании · ${esc(scope.territory)}" aria-label="Точек в исследовании: ${num(scope.stats.total)}">${num(scope.stats.total)}</span>`
      : '';
    return `<a class="catalog-nav-item${requests ? ' requests' : ''}" data-crm-route="${route}" href="${esc(cabinet.href)}">
      <span class="catalog-nav-icon" aria-hidden="true">${esc(icon)}</span><span>${esc(label)}</span>${badge}</a>`;
  });
  return `<aside class="catalog-nav" aria-label="Меню CRM">
    <nav aria-label="Разделы CRM">
      <a class="catalog-nav-item" id="catalogListLink" href="${esc(areaUrl(selectedArea, 'crm'))}" data-crm-route="public-leads" aria-current="page">
        <span class="catalog-nav-icon" aria-hidden="true">▤</span><span>Список ЛИДов</span></a>
      <div class="catalog-nav-label">Работа с клиентами</div>
      ${items.join('')}
    </nav>
  </aside>`;
}

function renderCatalog() {
  const selectedArea = area;
  const saved = catalogFilters[selectedArea] ??= {query: '', profile: 'all', price: 'all', start: 0};
  crmTab.innerHTML = `
    <div class="catalog-layout">
      ${catalogSidebar(selectedArea)}
      <div class="catalog-results">
        ${hero('Список ЛИДов', 'Оклейка и тонировка · публичный срез исследования')}
        <section class="card catalog-filters" aria-label="Фильтры списка ЛИДов">
          <label>Название, адрес или телефон<input type="search" id="catalogQuery" value="${esc(saved.query)}" autocomplete="off"></label>
          <label>Услуга<select id="catalogProfile"><option value="all">Все</option><option value="wrap">Оклейка</option><option value="tint">Тонировка</option>
            <option value="both">Обе услуги</option><option value="candidate">Кандидаты</option></select></label>
          <label>Цены<select id="catalogPrice"><option value="all">Все</option><option value="with">С ценами</option><option value="without">Без цен</option></select></label>
        </section>
        <p class="fine" id="catalogCount" role="status">Загружаю список ЛИДов…</p>
        <div class="catalog-list" id="catalogList"></div>
        <p class="catalog-pager">
          <button class="button secondary" id="catalogPrevious" type="button" disabled>Назад</button>
          <button class="button secondary" id="catalogNext" type="button" disabled>Дальше</button>
        </p>
      </div>
    </div>`;

  const find = id => document.getElementById(id);
  const search = find('catalogQuery');
  find('catalogListLink').addEventListener('click', event => {
    if (event.button || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    search.focus();
    search.scrollIntoView({block:'center'});
  });
  const profile = find('catalogProfile');
  const price = find('catalogPrice');
  const count = find('catalogCount');
  const list = find('catalogList');
  const previous = find('catalogPrevious');
  const next = find('catalogNext');
  let territoryCards;
  profile.value = saved.profile;
  price.value = saved.price;

  function displayRows() {
    if (!territoryCards) return;
    const rows = filterCatalog(territoryCards, saved);
    const lastPage = Math.max(0, Math.ceil(rows.length / catalogPageSize) - 1) * catalogPageSize;
    saved.start = Math.min(saved.start, lastPage);
    const end = Math.min(saved.start + catalogPageSize, rows.length);
    const first = rows.length ? saved.start + 1 : 0;
    const total = territoryCards.length;
    const noun = {one: 'карточка', few: 'карточки'}[catalogPlural.select(total)] || 'карточек';
    count.textContent = `Показано ${num(first)}–${num(end)} из ${num(rows.length)} · в срезе ${num(total)} ${noun}`;
    list.innerHTML = rows.slice(saved.start, end).map(catalogCard).join('') ||
      '<p class="card">По этим фильтрам карточек нет.</p>';
    previous.disabled = saved.start === 0;
    next.disabled = end === rows.length;
  }

  function updateFilters() {
    Object.assign(saved, {query: search.value, profile: profile.value, price: price.value, start: 0});
    displayRows();
  }

  async function showCatalog() {
    count.textContent = 'Загружаю список ЛИДов…';
    list.replaceChildren();
    try {
      const cards = await loadCatalog();
      if (!list.isConnected) return;
      territoryCards = cards.filter(card => Boolean(card.isMoscow) === (selectedArea === 'moscow'));
      displayRows();
    } catch {
      if (!list.isConnected) return;
      count.textContent = 'Не удалось загрузить список ЛИДов.';
      list.innerHTML = '<button class="button secondary" type="button">Повторить загрузку</button>';
      list.firstElementChild.onclick = showCatalog;
    }
  }

  search.addEventListener('input', updateFilters);
  profile.addEventListener('change', updateFilters);
  price.addEventListener('change', updateFilters);
  previous.onclick = () => { saved.start -= catalogPageSize; displayRows(); };
  next.onclick = () => { saved.start += catalogPageSize; displayRows(); };
  void showCatalog();
}

function heading(title, description, aside = '') {
  return `<div class="section-heading"><div><h2>${title}</h2><p>${description}</p></div>${aside}</div>`;
}

function hero(title, description = '', checked = DATA.researchDate) {
  return `<section class="hero"><span class="cut" aria-hidden="true"></span>
    <div class="hero-meta"><span class="tag">${esc(view().label)}</span><span class="tag">Проверено ${formatDate(checked)}</span></div>
    <h1>${esc(title)}</h1>${description ? `<p>${esc(description)}</p>` : ''}</section>`;

function sourceLink(id, label) {
  const source = DATA.sources[id];
  if (!source?.url) return '';
  return `<a class="source-ref" href="${esc(source.url)}" rel="noopener noreferrer" target="_blank">${esc(label || source.name)} ↗</a>`;
}

function metric(item) {
  const value = num(item.value);
  const prefix = item.approx ? '≈ ' : '';
  const sign = item.signed && item.value > 0 ? '+' : '';
  return `<dl class="metric"><dt>${esc(item.label)}</dt><dd>${prefix}${sign}${value}${item.unit ? ` <small>${esc(item.unit)}</small>` : ''}</dd>
    <div><p>${esc(item.period || '')}</p>${sourceLink(item.source)}</div></dl>`;
}

function seriesLegend(items, colors, total) {
  return `<ul class="legend">${items.map(([label, value, display = num(value)], index) =>
    `<li><i class="legend-dot" style="--datum:${colors[index % colors.length]}" aria-hidden="true"></i><span>${esc(label)}</span>
      <strong>${esc(display)} <small>${pct(value / total * 100)}</small></strong></li>`).join('')}</ul>`;
}

function donut(items, center) {
  const total = items.reduce((sum, [, value]) => sum + value, 0);
  if (!total) return '<p class="fine">В этом срезе 0 записей.</p>';
  let start = 0;
  const stops = items.map(([, value], index) => {
    const end = start + value / total * 100;
    const segment = `${palette[index % palette.length]} ${start}% ${end}%`;
    start = end;
    return segment;
  });
  return `<div class="donut-grid"><div class="donut" style="background:conic-gradient(${stops.join(',')})" aria-hidden="true">
    <span class="donut-center">${esc(center || compact.format(total))}</span></div>${seriesLegend(items, palette, total)}</div>`;
}

function bars(items) {
  const highest = Math.max(...items.map(([, value]) => value), 1);
  return `<ul class="bars">${items.map(([label, value]) => `<li><div class="bar-row"><span>${esc(label)}</span><strong>${num(value)}</strong></div>
    <div class="track" aria-hidden="true"><span style="width:${100 * value / highest}%"></span></div></li>`).join('')}</ul>`;
}

function columns(items, unit) {
  const upper = Math.max(...items.map(([, value]) => value), 1) * 1.2;
  return `<div class="columns" role="group" aria-label="${esc(unit || 'Значения')}">${items.map(([label, value, display = num(value)]) =>
    `<div class="column"><div class="column-plot"><strong>${esc(display)}</strong><span style="height:${100 * value / upper}%" aria-hidden="true"></span></div><small>${esc(label)}</small></div>`).join('')}</div>`;
}

function chart(item) {
  const content = item.type === 'donut' ? donut(item.items, item.center)
    : item.type === 'columns' ? columns(item.items, item.unit) : bars(item.items);
  return `<section class="card"><div class="chart-head"><h3>${esc(item.title)}</h3>
    ${item.subtitle ? `<p class="fine">${esc(item.subtitle)}</p>` : ''}</div>${content}
    ${item.note ? `<p class="chart-note">${esc(item.note)}</p>` : ''}${sourceLink(item.source)}</section>`;
}

    sections.map(section => `<section class="card block economy-section"><header class="block-head"><div><h3>${esc(section.title)}</h3>
    <p>${esc(section.description)}</p></div></header>${marketTable(section.metrics)}</section>`).join('') + `</section>` +

    <div class="metric-grid economy-metrics">${highlights.map(([item, label]) => economyTile(item, label)).join('')}</div></section>
    <div class="economy-visuals">
      <section class="card economy-compare"><div class="chart-head"><h2>${esc(comparison.label)}</h2>
      <p class="fine">${esc(comparison.period)} · ${esc(comparison.unit)}</p></div>
      ${columns(comparison.values.map((value, index) => [2025 + index, value, economyValue(comparison, index)]), comparison.label + ', ' + comparison.unit)}
      <div class="economy-chart-footer"><span class="economy-delta">${economyChange(comparison)} к 2025</span>${sourceLink(comparison.sources[0])}</div></section>
      ${registrationMix(DATA.economyContext.new, DATA.economyContext.used)}

}

function economyTile(item, label) {
  return `<dl class="metric economy-tile"><dt>${esc(label)}</dt><dd>${economyValue(item, 1)} <small>${esc(item.unit)}</small></dd>
    <dd class="economy-tile-meta"><div class="economy-tile-baseline"><span>2025 · ${economyValue(item, 0)}</span><span class="economy-delta">${economyChange(item)}</span></div>
    <p>${esc(item.period)}</p></dd></dl>`;
}

function registrationMix(newCars, usedCars) {
  const rings = newCars.values.map((value, index) => {
    const total = value + usedCars.values[index];
    const center = (newCars.approx?.[index] || usedCars.approx?.[index] ? '≈ ' : '') + compact.format(total);
    return `<div class="economy-ring"><h3>${2025 + index}</h3>${donut([
      ['Новые', value, economyValue(newCars, index)], ['С пробегом', usedCars.values[index], economyValue(usedCars, index)],
    ], center)}</div>`;
  }).join('');
  return `<section class="card economy-mix"><div class="chart-head"><h2>Состав регистраций легковых · Россия</h2>
    <p class="fine">${esc(newCars.period)} · общероссийский контекст</p></div>
    <div class="economy-rings">${rings}</div>
    <p class="chart-note">Доли от суммы регистраций новых и перерегистраций легковых с пробегом. Знаменатель — все операции этих двух групп по России.</p>
    <div class="economy-chart-sources">${sourceLink(newCars.sources[0], 'Новые')}${sourceLink(usedCars.sources[0], 'С пробегом')}</div></section>`;
}

function economyGrowth(items) {
  items = items.filter(([, item]) => item.comparable !== false && item.values.every(Number.isFinite) && item.values[0] > 0);
  const rates = items.map(([, item]) => economyRate(item));
  const maximum = Math.max(1, ...rates.map(Math.abs));
  return `<section class="card economy-growth"><div class="chart-head"><h2>Изменение к 2025 году</h2>
    <p class="fine">${esc(view().label)} · в процентах</p></div>
    <ul class="bars">${items.map(([label, item], index) => {
      const rate = rates[index];
      const width = Math.abs(rate) / maximum * 50;
      return `<li><div class="bar-row"><span>${esc(label)}</span><strong>${economyChange(item)}</strong></div>
        <div class="economy-track" aria-hidden="true"><span class="${rate < 0 ? 'negative' : ''}" style="--from:${rate < 0 ? 50 - width : 50}%;--width:${width}%"></span></div></li>`;
    }).join('')}</ul></section>`;
}

function economyValue(item, index) {
  if (!Number.isFinite(item.values[index])) return '—';
  return `${item.approx?.[index] ? '≈ ' : ''}${num(item.values[index])}`;
}

function economyRate(item) {
  const [previous, current] = item.values;
  return item.yoy ?? (current / previous - 1) * 100;
}

function economyChange(item) {
  if (item.comparable === false || !item.values.every(Number.isFinite) || (!item.change && item.values[0] === 0)) return '—';
  const [previous, current] = item.values;
  const difference = current - previous;
  if (item.change === 'rank') return difference ? `${difference < 0 ? '↑' : '↓'} ${num(Math.abs(difference))} поз.` : '0 поз.';
  const points = item.change === 'points';
  const value = Math.round((points ? difference : economyRate(item)) * 100) / 100;
  return `${value > 0 ? '+' : ''}${num(value)}${points ? ' п. п.' : '%'}`;
}

function economyValues(item) {
  const maximum = Math.max(...item.values, 1);
  return item.values.map((value, index) => `<td class="numeric" data-year="${2025 + index}">${economyValue(item, index)}
    ${item.comparable === false || !Number.isFinite(value) || item.change === 'rank' ? '' : `<span class="economy-bar" aria-hidden="true" style="--fill:${value / maximum * 100}%"></span>`}</td>`).join('');
}

function marketTable(items) {
  return `<table class="economy-table"><thead><tr><th scope="col">Показатель и период</th><th scope="col" class="numeric">2025</th><th scope="col" class="numeric">2026</th><th scope="col" class="numeric">Δ к 2025</th></tr></thead>
    <tbody>${items.map(item => `<tr><th scope="row"><strong>${esc(item.label)}</strong><span class="economy-period">${esc(item.period)}${item.unit ? ` · ${esc(item.unit)}` : ''}</span>
    ${item.note ? `<small class="economy-period">${esc(item.note)}</small>` : ''}<span class="economy-sources">${item.sources.map(id => sourceLink(id)).join('')}</span></th>
    ${economyValues(item)}
    <td class="numeric economy-change" data-year="Изменение">${economyChange(item)}</td></tr>`).join('')}</tbody></table>`;
}

function leads() {
  const s = view().stats;
  const topCities = s.cities.slice(0, 7);
  const other = s.cities.slice(7).reduce((total, [, count]) => total + count, 0);
  if (other) topCities.push(['Прочие населённые пункты', other]);
  const period = 'Срез ' + formatDate(DATA.dataDate);
  const cards = [
    {label:'Точек исследовано',value:s.total,period},
    {label:'Профиль подтверждён',value:s.confirmed,period:pct(s.confirmed/s.total*100)+' от исследованных'},
    {label:'К обзвону',value:s.call,period:num(s.candidates)+' кандидатов требуют проверки услуги'},
    {label:'Точки с ценами',value:s.withAmounts,period:num(s.pricePositions)+' опубликованных позиций'},
  ];
  const charts = [
    {title:'Квалификация',type:'donut',items:[['Подтверждённые',s.confirmed],['Кандидаты',s.candidates]]},
    {title:'Подтверждённые услуги',type:'donut',items:[['Тонировка',s.tintOnly],['Оклейка',s.wrapOnly],['Обе услуги',s.both]],subtitle:'Три непересекающиеся группы'},
    {title:'Источники исследования',type:'donut',items:s.sources,subtitle:'Уникальные точки после сверки'},
    area === 'region'
      ? {title:'География точек',type:'bars',items:topCities,subtitle:'Количество точек по населённым пунктам'}
      : {title:'Доступность телефона',type:'donut',items:[['Телефон указан',s.phones],['Без телефона',s.total-s.phones]]},
  ];
  return hero('Рыночная обстановка', 'Оклейка, тонировка и опубликованные цены · проверено 28.11.2026') +
    `<section class="metric-grid">${cards.map(metric).join('')}</section>
    <section class="block"><header class="block-head"><div><h2>Структура рынка</h2><p>Исследованные точки оклейки и тонировки · ${esc(view().label)}</p></div></header>
      <div class="chart-grid">${charts.map(chart).join('')}</div></section>
    <section class="card block">
      <h2>Опубликованные цены на работы</h2><p class="scope-note">${num(s.pricePositions)} поз. у ${num(s.withAmounts)} точек. Диапазоны отражают опубликованные цены, объём работ и комплектация внутри групп могут различаться.</p>
      <div class="table-wrap"><table class="range-table"><thead><tr><th>Работы</th><th class="numeric">Нижняя цена</th><th class="numeric">Верхняя цена</th><th class="numeric">Позиций</th><th class="numeric">Из них «от»</th></tr></thead>
      <tbody>${s.prices.map(item => `<tr><td>${esc(item.label)}</td><td class="numeric">${money(item.low)}</td><td class="numeric">${money(item.high)}</td><td class="numeric">${num(item.count)}</td><td class="numeric">${num(item.fromCount)}</td></tr>`).join('')}</tbody></table></div>
    </section>
    <section class="card block honeycomb"><div class="block-head"><div><h2>Работа с компаниями</h2><p>Откройте публичную выборку. Полная рабочая база доступна после входа в CRM.</p><p>В дополнительном каталоге по территории «${esc(view().territory)}» — ${num(view().directory.rows)} адресов со ссылками на Яндекс Карты. У ${num(view().directory.eligible)} указана оклейка или тонировка. До переноса в CRM у ${num(view().directory.unmatched)} профильных точек нужно сверить совпадения. Срез каталога от 14.10.2026.</p></div>
    <a class="button primary" href="#crm" data-section="crm">Открыть ЛИДы и СРМ</a></div></section>`;
}

function model() {
  return hero('Деньги в рынке', 'Оборот и маржинальный доход по сценарию продаж') + calculator();
}

function basketSettings() {
  const field = (key, label, value, name = label) => `<label class="field"><span>${label}</span>
    <input type="number" id="${key}" data-basket-key="${key}" aria-label="${name}" value="${value}" min="0" max="10000000"
      step="${key === 'target' ? '1' : 'any'}" inputmode="${key === 'target' ? 'numeric' : 'decimal'}"></label>`;
  const editor = ([label, key]) => `<fieldset class="basket-product"><legend>${label} плёнка</legend>
    ${field(key + 'Qty', 'Рулонов на точку', basket[key + 'Qty'], label + ' плёнка, рулонов на точку')}
    ${field(key + 'Price', 'Цена рулона, ₽', basket[key + 'Price'], label + ' плёнка, цена рулона в рублях')}
  </fieldset>`;
  return `<section class="card basket-settings" aria-labelledby="basket-settings-title">
    <div class="card-head"><h3 id="basket-settings-title">Параметры корзины</h3><p class="fine">Цены и количество рулонов можно менять вручную</p></div>
    <div class="basket-settings-grid">${products.map(editor).join('')}</div>
    <div class="basket-settings-footer"><div>
      ${field('target', 'Цель подключения, точек', target)}<p class="fine" id="targetProgress"></p>
    </div><div class="row-actions">
      <button class="button secondary small" id="resetBasket">Сбросить корзину</button>
      <button class="button secondary small" id="resetScenario">Сбросить весь сценарий</button>
    </div></div>
  </section>`;
}

function resetScenario(resetAll) {
  basket = {...defaultBasket};
  const keys = Object.keys(defaultBasket);
  if (resetAll) {
    target = defaultTarget;
    keys.push('target', 'points', 'margin');
  }
  const url = new URL(location.href);
  for (const key of keys) url.searchParams.delete(key);
  if (url.href !== location.href) history.replaceState(history.state, '', url.href);
  query = url.searchParams;
  state.calc = calculateRegional(resetAll ? 10 : state.calc.points, resetAll ? 20 : state.calc.margin, S.total);
  render();
  document.getElementById(resetAll ? 'resetScenario' : 'resetBasket').focus();
}

function areaUrl(nextArea, section) {
  const url = new URL(location.href);
  if (nextArea !== area) {
    for (const key of ['points', 'margin', 'target', ...Object.keys(defaultBasket)]) url.searchParams.delete(key);
  }
  url.searchParams.set('area', nextArea);
  url.hash = section;
  return url.href;
}

let lastLocation;

function render() {
  const section = getSection();
  document.title = 'FIVEROX · ' + view().territory;
  document.querySelectorAll('.territories [data-area]').forEach(node => {
    node.href = areaUrl(node.dataset.area, section);
    node.toggleAttribute('aria-current', node.dataset.area === area);
    if (node.dataset.area === area) node.setAttribute('aria-current', 'page');
  });
  document.querySelectorAll('.sections [data-section]').forEach(node => {
    node.toggleAttribute('aria-current', node.dataset.section === section);
    if (node.dataset.section === section) node.setAttribute('aria-current', 'page');
  });
  main.hidden = section === 'crm';
  crmTab.hidden = section !== 'crm';
  if (section === 'crm') {
    renderCatalog();
    return;
  }
  main.innerHTML = {market, leads, model}[section]();
  if (section === 'model') updateCalc();
}

function syncLocation() {
  if (location.href === lastLocation) return;
  lastLocation = location.href;
  const next = getArea();
  if (next !== area) {
    area = next;
    query = new URLSearchParams(location.search);
    S = modelBase();
    loadModel();
  }
  render();
}

document.addEventListener('click', event => {
  const link = event.target.closest('a[data-area], a[data-section], .logo');
  if (!link || event.button || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  const section = link.dataset.area ? getSection() : link.dataset.section || 'market';
  const nextArea = link.dataset.area || area;
  event.preventDefault();
  const next = areaUrl(nextArea, section);
  if (next !== location.href) history.pushState(null, '', next);
  syncLocation();
});
window.addEventListener('popstate', syncLocation);
window.addEventListener('hashchange', syncLocation);
document.querySelector('.skip').addEventListener('click', event => {
  event.preventDefault();
  const content = getSection() === 'crm' ? crmTab : main;
  content.focus();
  content.scrollIntoView({block:'start'});
});

main.addEventListener('input', event => {
  const input = event.target;
  if (input.matches('[data-basket-key]')) {
    updateBasketInput(input);
  } else if (input.id === 'pointsRange') {
    setPoints(input.valueAsNumber);
  } else if (['points','margin'].includes(input.id) && input.value !== '' && Number.isFinite(input.valueAsNumber)) {
    state.calc = input.id === 'points'
      ? calculateRegional(input.valueAsNumber, state.calc.margin, S.total)
      : calculateRegional(state.calc.points, input.valueAsNumber, S.total);
    updateCalc();
  }
});
main.addEventListener('focusout', event => {
  const input = event.target;
  if (['points','margin'].includes(input.id)) input.value = state.calc[input.id];
  if (input.matches('[data-basket-key]')) {
    const key = input.dataset.basketKey;
    input.value = key === 'target' ? target : basket[key];
  }
});
function setPoints(value) {
  state.calc = calculateRegional(value, state.calc.margin, S.total);
  document.getElementById('points').value = state.calc.points;
  updateCalc();
}
main.addEventListener('click', async event => {
  const button = event.target.closest('button');
  if (button?.hasAttribute('data-points')) setPoints(Number(button.dataset.points));
  if (['resetBasket','resetScenario'].includes(button?.id)) resetScenario(button.id === 'resetScenario');
  if (button?.id === 'shareCalc') {
    const url = new URL(location.href);
    url.searchParams.set('points', state.calc.points);
    url.searchParams.set('margin', state.calc.margin);
    applyScenarioToUrl(url);
    try {
      await navigator.clipboard.writeText(url.href);
      toast('Ссылка на расчёт скопирована');
    } catch {
      history.replaceState(null, '', url.href);
      toast('Ссылка на расчёт сохранена в адресе страницы');
    }
  }
});
lastLocation = location.href;
render();

})();</script>
